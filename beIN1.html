<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>شاشة البث المباشر</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HLS.js library for m3u8 live playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Google Font: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* خلفية زجاجية أنيقة */
    .glass-card {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* أبعاد إطار العرض القياسية */
    .video-frame-standard {
      position: relative;
      aspect-ratio: 16 / 9;
      width: min(100vw, calc(100vh * 1.77778));
      height: min(100vh, calc(100vw * 0.5625));
      max-width: 100%;
      max-height: 100%;
      transition: width 0.25s ease, height 0.25s ease;
    }

    /* حاوية المشغل مع دعم المرونة وملء الشاشة */
    .video-container {
      position: relative;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.85);
    }

    /* عند الانتقال لوضع ملء الشاشة الفعلي */
    :fullscreen, .video-container:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
    }

    /* حالة العرض الافتراضية مع الحفاظ على الأبعاد */
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: object-fit 0.3s ease, transform 0.3s ease;
      background: #000;
    }

    /* خيار تمديد الفيديو لملء الشاشة بالكامل بدون حواف سوداء */
    video.fill-screen {
      object-fit: cover !important;
    }

    /* دعم التدوير اليدوي بالعرض للهواتف التي لا تدعم قفل الشاشة البرمجي */
    .force-landscape {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      width: 100vh !important;
      height: 100vw !important;
      transform: translate(-50%, -50%) rotate(90deg) !important;
      z-index: 99999 !important;
    }

    /* خلفية التوهج المحيطي Ambient Glow */
    .ambient-glow {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: blur(55px);
      opacity: 0.35;
      pointer-events-none;
      z-index: 1;
    }

    /* تصميم أزرار التحكم بنسبة أبعاد 16:9 شاشة عريضة محكمة */
    .ctrl-btn {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 0.55rem;
      /* تثبيت نسبة الأبعاد 16:9 الصارمة */
      width: 68px;
      height: calc(68px * 9 / 16); /* 38.25px */
      aspect-ratio: 16 / 9;
      flex-shrink: 0;
      box-sizing: border-box;
      padding: 0 4px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #f1f5f9;
      overflow: hidden;
      white-space: nowrap;
    }
    @media (min-width: 640px) {
      .ctrl-btn {
        width: 76px;
        height: calc(76px * 9 / 16); /* 42.75px */
        border-radius: 0.65rem;
      }
    }
    .ctrl-btn:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(56, 189, 248, 0.6);
      color: #38bdf8;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }
    .ctrl-btn:active {
      transform: scale(0.95);
    }
    .ctrl-btn.active {
      background: rgba(2, 132, 199, 0.4);
      border-color: #38bdf8;
      color: #38bdf8;
    }
  </style>
</head>
<body class="bg-black flex items-center justify-center">

  <div id="playerWrapper" class="video-container video-frame-standard group">
    <!-- توهج الإضاءة المحيطية المتفاعل مع ألوان الفيديو -->
    <canvas id="ambientCanvas" class="ambient-glow"></canvas>

    <!-- عنصر مشغل الفيديو -->
    <video 
      id="videoPlayer" 
      class="relative z-10 focus:outline-none" 
      playsinline 
      crossorigin="anonymous">
    </video>

    <div id="spinnerOverlay" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-black/50 backdrop-blur-sm transition-opacity duration-300 pointer-events-none">
      <div class="relative w-14 h-14">
        <div class="w-14 h-14 border-4 border-sky-500/20 border-t-sky-500 rounded-full animate-spin"></div>
        <div class="absolute inset-0 flex items-center justify-center text-xs font-semibold text-sky-400">بث</div>
      </div>
      <span class="mt-3 text-xs text-slate-300 font-medium">جاري تحميل البث المباشر...</span>
    </div>

    <div id="controlOverlay" class="absolute bottom-5 inset-x-5 z-30 flex items-center justify-between pointer-events-auto transition-opacity duration-300">
      
      <!-- الأزرار على اليمين (تشغيل وكتم الصوت) بنسبة 16:9 -->
      <div class="flex items-center gap-2.5">
        <!-- زر التشغيل / الإيقاف المؤقت -->
        <button id="playPauseBtn" class="ctrl-btn focus:outline-none" title="تشغيل / إيقاف مؤقت">
          <svg id="playIcon" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="pauseIcon" class="hidden w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>

        <!-- زر كتم / تفعيل الصوت -->
        <button id="muteBtn" class="ctrl-btn focus:outline-none" title="كتم / تفعيل الصوت">
          <svg id="volumeHighIcon" class="w-4 h-4 sm:w-5 sm:h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/>
          </svg>
          <svg id="volumeMuteIcon" class="hidden w-4 h-4 sm:w-5 sm:h-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
          </svg>
        </button>
      </div>

      <!-- الأزرار على اليسار (زر ملء الشاشة بالعرض وتيليجرام) بنسبة 16:9 -->
      <div class="flex items-center gap-2.5">
        <!-- زر ملء الشاشة بالعرض -->
        <button id="fullscreenBtn" class="ctrl-btn gap-1 text-sky-400 font-bold" title="ملء الشاشة بالعرض">
          <svg id="enterFsIcon" class="w-3.5 h-3.5 sm:w-4 sm:h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            <rect x="3" y="4" width="18" height="16" rx="2" stroke-width="2"/>
          </svg>
          <svg id="exitFsIcon" class="hidden w-3.5 h-3.5 sm:w-4 sm:h-4 text-amber-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
          <span class="text-[11px] sm:text-xs leading-none">بالعرض</span>
        </button>

        <!-- زر قناة تيليجرام -->
        <a href="https://t.me/shawkatiptv" target="_blank" rel="noopener noreferrer" class="ctrl-btn text-[#229ED9] hover:text-white" title="قناة تيليجرام @shawkatiptv">
          <svg class="w-4 h-4 sm:w-5 sm:h-5 fill-current" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
          </svg>
        </a>
      </div>

    </div>
  </div>

  <script>
    const STREAM_URL = "https://kurdtv.org/api/public/hls?u=https%3A%2F%2Fprod-fastly-us-west-1.video.pscp.tv%2FTranscoding%2Fv1%2Fhls%2FC_YZ4LkNeYnxcDUTCLdzJJg1HgznTyXiwlPTw6NXkppWlI2IIxpKHd4gE-TkWcm3cn70Vt9ZuYp5mI4AOe6omg%2Ftranscode%2Fus-west-1%2Fperiscope-replay-direct-prod-us-west-1-public%2FeyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsInZlcnNpb24iOiIyIn0.eyJFbmNvZGVyU2V0dGluZyI6ImVuY29kZXJfc2V0dGluZ183MjBwMzBfMTAiLCJIZWlnaHQiOjcyMCwiS2JwcyI6Mjc1MCwiV2lkdGgiOjEyODB9.ldktM4fCFRfkP4ZEBfZPKtlAUNAcTPkoz994YJAzWpE%2Fdynamic_delta.m3u8%3Ftype%3Dlive&_HLS_skip=YES";

    const video = document.getElementById('videoPlayer');
    const playerWrapper = document.getElementById('playerWrapper');
    const spinner = document.getElementById('spinnerOverlay');
    const ambientCanvas = document.getElementById('ambientCanvas');
    const ambientCtx = ambientCanvas.getContext('2d');

    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');

    const muteBtn = document.getElementById('muteBtn');
    const volumeHighIcon = document.getElementById('volumeHighIcon');
    const volumeMuteIcon = document.getElementById('volumeMuteIcon');

    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const enterFsIcon = document.getElementById('enterFsIcon');
    const exitFsIcon = document.getElementById('exitFsIcon');

    const controlOverlay = document.getElementById('controlOverlay');

    let hlsInstance = null;
    let hideTimer = null;
    let isForcedLandscape = false;

    function handleUserActivity() {
      document.body.style.cursor = 'default';
      if (controlOverlay) controlOverlay.style.opacity = '1';

      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        if (!video.paused) {
          document.body.style.cursor = 'none';
          if (controlOverlay) controlOverlay.style.opacity = '0';
        }
      }, 3500);
    }

    window.addEventListener('mousemove', handleUserActivity);
    window.addEventListener('touchstart', handleUserActivity, { passive: true });
    window.addEventListener('click', handleUserActivity);

    function updatePlayPauseIcons() {
      if (video.paused || video.ended) {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        if (controlOverlay) controlOverlay.style.opacity = '1';
      } else {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
      }
    }

    function togglePlay() {
      if (!hlsInstance && !video.src) {
        initializeStream(STREAM_URL);
        return;
      }
      if (video.paused || video.ended) {
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            video.muted = true;
            updateMuteIcons();
            video.play();
          });
        }
      } else {
        video.pause();
      }
      updatePlayPauseIcons();
    }

    playPauseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlay();
    });

    function updateMuteIcons() {
      if (video.muted || video.volume === 0) {
        volumeHighIcon.classList.add('hidden');
        volumeMuteIcon.classList.remove('hidden');
      } else {
        volumeHighIcon.classList.remove('hidden');
        volumeMuteIcon.classList.add('hidden');
      }
    }

    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      video.muted = !video.muted;
      updateMuteIcons();
    });

    function isCurrentlyFullscreen() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement ||
        isForcedLandscape
      );
    }

    function updateFullscreenIcons() {
      const isFs = isCurrentlyFullscreen();
      if (isFs) {
        enterFsIcon.classList.add('hidden');
        exitFsIcon.classList.remove('hidden');
        fullscreenBtn.classList.add('active');
      } else {
        enterFsIcon.classList.remove('hidden');
        exitFsIcon.classList.add('hidden');
        fullscreenBtn.classList.remove('active');
      }
    }

    async function toggleFullscreenLandscape() {
      const isFs = isCurrentlyFullscreen();

      if (!isFs) {
        try {
          if (playerWrapper.requestFullscreen) {
            await playerWrapper.requestFullscreen();
          } else if (playerWrapper.webkitRequestFullscreen) {
            await playerWrapper.webkitRequestFullscreen();
          } else if (playerWrapper.mozRequestFullScreen) {
            await playerWrapper.mozRequestFullScreen();
          } else if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen();
          }
        } catch (_) {}

        let orientationLocked = false;
        if (screen.orientation && screen.orientation.lock) {
          try {
            await screen.orientation.lock('landscape');
            orientationLocked = true;
          } catch (_) {}
        }

        if (!orientationLocked && window.innerHeight > window.innerWidth) {
          playerWrapper.classList.add('force-landscape');
          isForcedLandscape = true;
        }

      } else {
        if (isForcedLandscape) {
          playerWrapper.classList.remove('force-landscape');
          isForcedLandscape = false;
        }

        try {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            await document.webkitExitFullscreen();
          } else if (document.mozCancelFullScreen) {
            await document.mozCancelFullScreen();
          }
        } catch (_) {}

        if (screen.orientation && screen.orientation.unlock) {
          try {
            screen.orientation.unlock();
          } catch (_) {}
        }
      }

      updateFullscreenIcons();
    }

    fullscreenBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFullscreenLandscape();
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && isForcedLandscape) {
        playerWrapper.classList.remove('force-landscape');
        isForcedLandscape = false;
      }
      updateFullscreenIcons();
    });
    document.addEventListener('webkitfullscreenchange', updateFullscreenIcons);
    document.addEventListener('mozfullscreenchange', updateFullscreenIcons);

    playerWrapper.addEventListener('dblclick', (e) => {
      if (e.target.closest('button') || e.target.closest('a')) return;
      toggleFullscreenLandscape();
    });

    function initializeStream(url) {
      if (spinner) spinner.classList.remove('opacity-0');

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 60,
          maxBufferLength: 30,
          liveSyncDurationCount: 3
        });

        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          if (spinner) spinner.classList.add('opacity-0');
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {
              video.muted = true;
              updateMuteIcons();
              video.play().catch(() => updatePlayPauseIcons());
            });
          }
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                hlsInstance.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hlsInstance.recoverMediaError();
                break;
              default:
                hlsInstance.destroy();
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
          if (spinner) spinner.classList.add('opacity-0');
          video.play().catch(() => {
            video.muted = true;
            updateMuteIcons();
            video.play().catch(() => updatePlayPauseIcons());
          });
        });
      }
    }

    video.addEventListener('play', () => {
      updatePlayPauseIcons();
      handleUserActivity();
    });

    video.addEventListener('pause', () => {
      updatePlayPauseIcons();
      handleUserActivity();
    });

    video.addEventListener('waiting', () => {
      if (spinner) spinner.classList.remove('opacity-0');
    });

    video.addEventListener('playing', () => {
      if (spinner) spinner.classList.add('opacity-0');
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'KeyF') {
        e.preventDefault();
        toggleFullscreenLandscape();
      } else if (e.code === 'KeyM') {
        video.muted = !video.muted;
        updateMuteIcons();
      }
    });

    function renderAmbientLight() {
      if (!video.paused && !video.ended && video.readyState >= 2) {
        try {
          ambientCanvas.width = 64;
          ambientCanvas.height = 36;
          ambientCtx.drawImage(video, 0, 0, 64, 36);
        } catch (_) {}
      }
      requestAnimationFrame(renderAmbientLight);
    }
    requestAnimationFrame(renderAmbientLight);

    window.addEventListener('DOMContentLoaded', () => {
      initializeStream(STREAM_URL);
    });
  </script>
</body>
</html>
