  <script type="text/javascript">
    // استخراج المتغيرات من رابط الصفحة
    function getUrlParam(name, fallback) {
      var regex = new RegExp("[\\?&]" + name + "=([^&#]*)");
      var results = regex.exec(location.search);
      return results === null ? fallback : decodeURIComponent(results[1].replace(/\+/g, " "));
    }

    var manifestUrl = getUrlParam('get', "https://scccrwb-live.cdn.intigral-ott.net/bpk-tv/APL/wv-pr/manifest.mpd");
    var keyId = getUrlParam('key', "807d6b44b0ab6496877be8513313e3ce");
    var key = getUrlParam('key2', "a57d64d5e08284e52555f57b8e68b21c");

    // عناصر واجهة المستخدم
    var video = document.getElementById('videoElement');
    var container = document.getElementById('playerContainer');
    var spinner = document.getElementById('bufferingSpinner');
    var playPauseBtn = document.getElementById('playPauseBtn');
    var playIcon = document.getElementById('playIcon');
    var pauseIcon = document.getElementById('pauseIcon');
    var bigPlayBtn = document.getElementById('bigPlayBtn');
    var volumeBtn = document.getElementById('volumeBtn');
    var volHighIcon = document.getElementById('volHighIcon');
    var volMuteIcon = document.getElementById('volMuteIcon');
    var volumeSlider = document.getElementById('volumeSlider');
    var unmuteNotice = document.getElementById('unmuteNotice');
    var unmuteHeaderBtn = document.getElementById('unmuteHeaderBtn');
    var syncLiveBtn = document.getElementById('syncLiveBtn');
    var fullscreenBtn = document.getElementById('fullscreenBtn');
    var enterFsIcon = document.getElementById('enterFsIcon');
    var exitFsIcon = document.getElementById('exitFsIcon');
    var pipBtn = document.getElementById('pipBtn');
    var rotateBtn = document.getElementById('rotateBtn');
    var toggleQualityBtn = document.getElementById('toggleQualityBtn');
    var qualityMenu = document.getElementById('qualityMenu');
    var qualityList = document.getElementById('qualityList');
    var currentQualityLabel = document.getElementById('currentQualityLabel');
    var statsBtn = document.getElementById('statsBtn');
    var statsModal = document.getElementById('statsModal');
    var closeStatsBtn = document.getElementById('closeStatsBtn');
    var topControls = document.getElementById('topControls');
    var bottomControls = document.getElementById('bottomControls');

    var player = null;
    var controlsTimeout = null;

    async function initApp() {
      // تثبيت Polyfills لضمان التوافق مع كافة المتصفحات
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        console.error('المتصفح لا يدعم مشغل Shaka Player الحديث.');
        return;
      }

      player = new shaka.Player(video);

      // إعداد ClearKey DRM وتخصيص البفر لتحقيق أقصى سلاسة بدون تقطيع
      var clearKeysConfig = {};
      if (keyId && key) {
        clearKeysConfig[keyId] = key;
      }

      player.configure({
        drm: {
          clearKeys: clearKeysConfig
        },
        streaming: {
          bufferingGoal: 20,          // حجز ذاكرة مسبقة لضمان تشغيل سلس
          rebufferingGoal: 4,         // استئناف فوري عند ضعف الإنترنت
          bufferBehind: 15,
          lowLatencyMode: true,       // وضع زمن الوصول المنخفض للبثوث المباشرة
          retryParameters: {
            maxAttempts: 10,
            baseDelay: 500,
            backoffFactor: 1.5
          }
        },
        abr: {
          enabled: true,              // تشغيل اختيار الدقة التلقائي الذكي
          defaultBandwidthEstimate: 3000000
        }
      });

      player.addEventListener('buffering', function(event) {
        if (event.buffering) {
          spinner.classList.remove('opacity-0');
        } else {
          spinner.classList.add('opacity-0');
        }
      });

      player.addEventListener('error', function(event) {
        console.error('حدث خطأ في المشغل:', event.detail);
      });

      // تحميل البث
      try {
        await player.load(manifestUrl);
        console.log('تم تحميل البث بنجاح.');
        populateQualityOptions();

        // محاولة تشغيل الصوت تلقائياً بأعلى صوت
        video.muted = false;
        video.volume = 1.0;
        volumeSlider.value = 1.0;
        updateVolumeIcons();

        var playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.then(function() {
            // بدأ التشغيل بالصوت بنجاح
            unmuteNotice.classList.add('hidden');
          }).catch(function() {
            // تم حظر الصوت من سياسة المتصفح: يبدأ كتم الصوت مؤقتاً لحين لمس الشاشة
            video.muted = true;
            video.play();
            unmuteNotice.classList.remove('hidden');
            setupGlobalAutoUnmute();
          });
        }
      } catch (error) {
        console.error('فشل في تشغيل رابط البث:', error);
      }
    }

    // فك حظر الصوت فوراً مع أول لمسة أو نقرة أو تمرير في الصفحة
    function setupGlobalAutoUnmute() {
      var unlockEvents = ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'scroll'];
      
      function unlockAudio() {
        if (video.muted) {
          video.muted = false;
          video.volume = 1.0;
          volumeSlider.value = 1.0;
          updateVolumeIcons();
          unmuteNotice.classList.add('hidden');
        }
        unlockEvents.forEach(function(evt) {
          window.removeEventListener(evt, unlockAudio, true);
        });
      }

      unlockEvents.forEach(function(evt) {
        window.addEventListener(evt, unlockAudio, { capture: true, once: true });
      });
    }

    function togglePlay() {
      if (video.paused) {
        video.play();
        unmuteNotice.classList.add('hidden');
      } else {
        video.pause();
      }
    }

    video.addEventListener('play', function() {
      playIcon.classList.add('hidden');
      pauseIcon.classList.remove('hidden');
      bigPlayBtn.classList.add('hidden');
    });

    video.addEventListener('pause', function() {
      playIcon.classList.remove('hidden');
      pauseIcon.classList.add('hidden');
      bigPlayBtn.classList.remove('hidden');
    });

    playPauseBtn.addEventListener('click', togglePlay);
    bigPlayBtn.addEventListener('click', togglePlay);
    video.addEventListener('click', togglePlay);

    // تفعيل الصوت مباشرة
    function forceSound() {
      video.muted = false;
      video.volume = 1.0;
      volumeSlider.value = 1.0;
      updateVolumeIcons();
      unmuteNotice.classList.add('hidden');
    }

    unmuteHeaderBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      forceSound();
    });

    // آلية تدوير الشاشة الذكية (دعم Screen Orientation API + تدوير برمجي بديل)
    var isRotated = false;
    async function toggleScreenRotation() {
      try {
        // إذا كان المتصفح يدعم Screen Orientation في وضع ملء الشاشة
        if (screen.orientation && screen.orientation.lock) {
          if (!document.fullscreenElement) {
            if (container.requestFullscreen) {
              await container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) {
              await container.webkitRequestFullscreen();
            }
          }
          if (screen.orientation.type.includes('portrait')) {
            await screen.orientation.lock('landscape');
          } else {
            await screen.orientation.lock('portrait');
          }
          return;
        }
      } catch (err) {
        console.log('استخدام التدوير البرمجي البديل:', err);
      }

      // تدوير بديل يدعم كافة الأجهزة والشاشات عبر CSS
      isRotated = !isRotated;
      if (isRotated) {
        video.classList.add('rotate-90-mode');
      } else {
        video.classList.remove('rotate-90-mode');
      }
    }

    rotateBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleScreenRotation();
    });

    function updateVolumeIcons() {
      if (video.muted || video.volume === 0) {
        volHighIcon.classList.add('hidden');
        volMuteIcon.classList.remove('hidden');
      } else {
        volHighIcon.classList.remove('hidden');
        volMuteIcon.classList.add('hidden');
      }
    }

    volumeBtn.addEventListener('click', function() {
      video.muted = !video.muted;
      updateVolumeIcons();
    });

    volumeSlider.addEventListener('input', function(e) {
      var val = parseFloat(e.target.value);
      video.volume = val;
      video.muted = val === 0;
      updateVolumeIcons();
    });

    syncLiveBtn.addEventListener('click', function() {
      if (player && player.seekRange) {
        var seekRange = player.seekRange();
        video.currentTime = seekRange.end;
      }
    });

    function populateQualityOptions() {
      if (!player) return;
      var tracks = player.getVariantTracks();
      // استخراج المسارات المصورة الفريدة حسب الارتفاع
      var uniqueTracks = [];
      var seenHeights = new Set();

      tracks.forEach(function(track) {
        if (track.height && !seenHeights.has(track.height)) {
          seenHeights.add(track.height);
          uniqueTracks.push(track);
        }
      });

      uniqueTracks.sort(function(a, b) { return b.height - a.height; });

      qualityList.innerHTML = '';

      // خيار تلقائي (Auto ABR)
      var autoBtn = document.createElement('button');
      autoBtn.className = "w-full text-right px-3 py-1.5 rounded text-white hover:bg-sky-500/20 hover:text-sky-400 font-semibold transition";
      autoBtn.textContent = "تلقائي (موصى به)";
      autoBtn.onclick = function() {
        player.configure({ abr: { enabled: true } });
        currentQualityLabel.textContent = "تلقائي";
        qualityMenu.classList.add('hidden');
      };
      qualityList.appendChild(autoBtn);

      uniqueTracks.forEach(function(track) {
        var btn = document.createElement('button');
        btn.className = "w-full text-right px-3 py-1.5 rounded text-slate-300 hover:bg-sky-500/20 hover:text-sky-400 transition";
        btn.textContent = track.height + "p (" + Math.round(track.bandwidth / 1000) + " kbps)";
        btn.onclick = function() {
          player.configure({ abr: { enabled: false } });
          player.selectVariantTrack(track, true);
          currentQualityLabel.textContent = track.height + "p";
          qualityMenu.classList.add('hidden');
        };
        qualityList.appendChild(btn);
      });
    }

    toggleQualityBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      qualityMenu.classList.toggle('hidden');
      statsModal.classList.add('hidden');
    });

    fullscreenBtn.addEventListener('click', function() {
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
        enterFsIcon.classList.add('hidden');
        exitFsIcon.classList.remove('hidden');

        // محاولة تحويل الهاتف لوضع العرض العرضي (Landscape) تلقائياً عند ملء الشاشة
        if (screen.orientation && screen.orientation.lock && window.innerWidth < 768) {
          screen.orientation.lock('landscape').catch(function() {});
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
        enterFsIcon.classList.remove('hidden');
        exitFsIcon.classList.add('hidden');
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }
    });

    if (document.pictureInPictureEnabled) {
      pipBtn.addEventListener('click', function() {
        if (document.pictureInPictureElement) {
          document.exitPictureInPicture();
        } else {
          video.requestPictureInPicture();
        }
      });
    } else {
      pipBtn.style.display = 'none';
    }

    // إحصائيات البث المباشر
    statsBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      statsModal.classList.toggle('hidden');
      qualityMenu.classList.add('hidden');
      updateStats();
    });

    closeStatsBtn.addEventListener('click', function() {
      statsModal.classList.add('hidden');
    });

    function updateStats() {
      if (!player || statsModal.classList.contains('hidden')) return;
      var stats = player.getStats();
      document.getElementById('statResolution').textContent = video.videoWidth + 'x' + video.videoHeight;
      document.getElementById('statBitrate').textContent = Math.round(stats.streamBandwidth / 1000) + ' kbps';
      document.getElementById('statBuffer').textContent = stats.bufferingTime.toFixed(1) + 's';
      document.getElementById('statDropped').textContent = stats.droppedFrames;
    }

    setInterval(updateStats, 1500);

    function showControls() {
      topControls.style.opacity = '1';
      bottomControls.style.opacity = '1';
      clearTimeout(controlsTimeout);
      controlsTimeout = setTimeout(function() {
        if (!video.paused && qualityMenu.classList.contains('hidden') && statsModal.classList.contains('hidden')) {
          topControls.style.opacity = '0';
          bottomControls.style.opacity = '0';
        }
      }, 3500);
    }

    container.addEventListener('mousemove', showControls);
    container.addEventListener('touchstart', showControls, { passive: true });

    document.addEventListener('click', function(e) {
      if (!qualityMenu.contains(e.target) && e.target !== toggleQualityBtn) {
        qualityMenu.classList.add('hidden');
      }
      if (!statsModal.contains(e.target) && e.target !== statsBtn) {
        statsModal.classList.add('hidden');
      }
    });

    // تشغيل التطبيق عند اكتمال تحميل الصفحة
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
