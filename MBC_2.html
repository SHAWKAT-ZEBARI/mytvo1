  <!-- خط Cairo الأنيق -->

  <style>
    * {
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #030712;
      overflow: hidden;
    }

    /* إخفاء شريط التمرير بالكامل */
    ::-webkit-scrollbar {
      display: none;
    }

    /* كروت التحكم بتأثير الزجاج الاحترافي */
    .glass-card {
      background: rgba(17, 24, 39, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* حاوية مخصصة لتثبيت نسبة العرض 16:9 في الوضع العادي */
    .video-frame-16-9 {
      position: relative;
      aspect-ratio: 16 / 9;
      width: min(100vw, calc(100vh * 1.77778));
      height: min(100vh, calc(100vw * 0.5625));
      max-width: 100%;
      max-height: 100%;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* وضع ملء الشاشة النقي (Clean In-Window Fullscreen) */
    /* هذا الوضع يملأ الشاشة 100% دون تفعيل رسالة المتصفح المزعجة "للخروج اضغط Esc" */
    .clean-fullscreen-mode {
      position: fixed !important;
      inset: 0 !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      z-index: 2147483647 !important;
      background: #000000 !important;
      border-radius: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .clean-fullscreen-mode .video-frame-16-9 {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      aspect-ratio: unset !important;
    }

    /* وضع التدوير الأفقي الإجباري للشاشات الرأسية (Forced Landscape Fullscreen) */
    .forced-landscape-mode {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      width: 100vh !important;
      height: 100vw !important;
      max-width: 100vh !important;
      max-height: 100vw !important;
      transform: translate(-50%, -50%) rotate(90deg) !important;
      transform-origin: center center !important;
      z-index: 2147483647 !important;
      background: #000000 !important;
      border-radius: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }

    .forced-landscape-mode .video-frame-16-9 {
      width: 100vh !important;
      height: 100vw !important;
      max-width: 100vh !important;
      max-height: 100vw !important;
      aspect-ratio: unset !important;
    }

    /* ضمان ظهور الأزرار فوق طبقة الفيديو */
    #floatingQualityContainer, #qualityMenu, #unmuteNotice, #toastNotification {
      z-index: 99999 !important;
      -webkit-transform: translate3d(0, 0, 0) !important;
      transform: translate3d(0, 0, 0) !important;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      touch-action: manipulation;
    }

    /* زر التحكم المستقل */
    .ctrl-btn {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: rgba(17, 24, 39, 0.9) !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      color: #f8fafc !important;
      border-radius: 12px !important;
      cursor: pointer !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      pointer-events: auto !important;
      transition: all 0.15s ease-in-out !important;
    }

    .ctrl-btn:hover {
      background: rgba(30, 41, 59, 0.95) !important;
      border-color: rgba(56, 189, 248, 0.5) !important;
      transform: translateY(-1px);
    }

    .ctrl-btn:active {
      transform: scale(0.95) !important;
    }
  </style>
</head>

  <script type="text/javascript">
    // استخراج المتغيرات من رابط الصفحة
    function getUrlParam(name, fallback) {
      var regex = new RegExp("[\\?&]" + name + "=([^&#]*)");
      var results = regex.exec(location.search);
      return results === null ? fallback : decodeURIComponent(results[1].replace(/\+/g, " "));
    }

    var manifestUrl = getUrlParam('get', "https://ev-fast-mpd.starzplayarabia.com/live/eds/MBC_2HD/DASH/MBC_2HD.mpd");
    var keyId = getUrlParam('key', "535b41e50f71d5dcdd7b61685500980f");
    var key = getUrlParam('key2', "864e981865940ef26cde333a1a8be344");

    // عناصر الصفحة
    var video = document.getElementById('videoElement');
    var container = document.getElementById('playerContainer');
    var videoWrapper = document.getElementById('videoWrapper');
    var spinner = document.getElementById('bufferingSpinner');
    var playPauseBtn = document.getElementById('playPauseBtn');
    var playIcon = document.getElementById('playIcon');
    var pauseIcon = document.getElementById('pauseIcon');
    var unmuteNotice = document.getElementById('unmuteNotice');
    var unmuteHeaderBtn = document.getElementById('unmuteHeaderBtn');
    var toggleQualityBtn = document.getElementById('toggleQualityBtn');
    var qualityMenu = document.getElementById('qualityMenu');
    var qualityList = document.getElementById('qualityList');
    var currentQualityLabel = document.getElementById('currentQualityLabel');
    var floatingQualityContainer = document.getElementById('floatingQualityContainer');
    var fullscreenBtn = document.getElementById('fullscreenBtn');
    var enterFsIcon = document.getElementById('enterFsIcon');
    var exitFsIcon = document.getElementById('exitFsIcon');
    var toastNotification = document.getElementById('toastNotification');
    var toastMsg = document.getElementById('toastMsg');

    var player = null;
    var controlsTimeout = null;
    var isCleanFullscreen = false;
    var isForcedRotation = false;
    var toastTimeout = null;

    // عرض تنبيه خفيف وسريع بدون تشويش
    function showToast(text) {
      if (!toastNotification || !toastMsg) return;
      toastMsg.textContent = text;
      toastNotification.classList.remove('opacity-0');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(function() {
        toastNotification.classList.add('opacity-0');
      }, 2000);
    }

    async function initApp() {
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        console.error('المتصفح لا يدعم مشغل Shaka Player الحديث.');
        return;
      }

      player = new shaka.Player(video);

      // إعداد ClearKey DRM وتخصيص البفر
      var clearKeysConfig = {};
      if (keyId && key) {
        clearKeysConfig[keyId] = key;
      }

      player.configure({
        drm: {
          clearKeys: clearKeysConfig
        },
        streaming: {
          bufferingGoal: 20,
          rebufferingGoal: 4,
          bufferBehind: 15,
          lowLatencyMode: true,
          retryParameters: {
            maxAttempts: 10,
            baseDelay: 500,
            backoffFactor: 1.5
          }
        },
        abr: {
          enabled: true,
          defaultBandwidthEstimate: 3000000
        }
      });

      player.addEventListener('buffering', function(event) {
        if (event.buffering) {
          spinner.classList.remove('opacity-0');
        } else {
          spinner.classList.add('opacity-0');
        }
      });

      player.addEventListener('error', function(event) {
        console.error('حدث خطأ في المشغل:', event.detail);
      });

      try {
        await player.load(manifestUrl);
        populateQualityOptions();

        video.muted = false;
        video.volume = 1.0;

        var playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.then(function() {
            unmuteNotice.classList.add('hidden');
          }).catch(function() {
            video.muted = true;
            video.play();
            unmuteNotice.classList.remove('hidden');
            setupGlobalAutoUnmute();
          });
        }
      } catch (error) {
        console.error('فشل في تشغيل رابط البث:', error);
      }
    }

    function setupGlobalAutoUnmute() {
      var unlockEvents = ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'scroll'];
      
      function unlockAudio() {
        if (video.muted) {
          video.muted = false;
          video.volume = 1.0;
          unmuteNotice.classList.add('hidden');
        }
        unlockEvents.forEach(function(evt) {
          window.removeEventListener(evt, unlockAudio, true);
        });
      }

      unlockEvents.forEach(function(evt) {
        window.addEventListener(evt, unlockAudio, { capture: true, once: true });
      });
    }

    function togglePlay() {
      if (video.paused) {
        video.play();
        unmuteNotice.classList.add('hidden');
      } else {
        video.pause();
      }
    }

    function updatePlayPauseIcons() {
      if (video.paused) {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
      } else {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
      }
    }

    video.addEventListener('play', updatePlayPauseIcons);
    video.addEventListener('pause', updatePlayPauseIcons);

    playPauseBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      togglePlay();
    });

    video.addEventListener('click', function(e) {
      // إذا كان النقر نقراً عادياً نقوم بالتبديل
      togglePlay();
    });

    // النقر المزدوج على الفيديو لملء الشاشة مباشرة
    video.addEventListener('dblclick', function(e) {
      e.preventDefault();
      toggleCleanFullscreen();
    });

    unmuteHeaderBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      video.muted = false;
      video.volume = 1.0;
      unmuteNotice.classList.add('hidden');
    });

    function populateQualityOptions() {
      if (!player) return;
      var tracks = player.getVariantTracks();
      var uniqueTracks = [];
      var seenHeights = new Set();

      tracks.forEach(function(track) {
        if (track.height && !seenHeights.has(track.height)) {
          seenHeights.add(track.height);
          uniqueTracks.push(track);
        }
      });

      uniqueTracks.sort(function(a, b) { return b.height - a.height; });
      qualityList.innerHTML = '';

      var autoBtn = document.createElement('button');
      autoBtn.className = "w-full text-right px-3 py-2 rounded-lg text-white hover:bg-sky-500/20 hover:text-sky-400 font-semibold transition flex items-center justify-between";
      autoBtn.innerHTML = "<span>تلقائي (موصى به)</span><span class='text-[10px] bg-sky-500/20 text-sky-400 px-1.5 py-0.5 rounded'>Auto</span>";
      autoBtn.onclick = function() {
        player.configure({ abr: { enabled: true } });
        currentQualityLabel.textContent = "تلقائي";
        qualityMenu.classList.add('hidden');
      };
      qualityList.appendChild(autoBtn);

      uniqueTracks.forEach(function(track) {
        var btn = document.createElement('button');
        btn.className = "w-full text-right px-3 py-2 rounded-lg text-slate-300 hover:bg-sky-500/20 hover:text-sky-400 transition flex items-center justify-between";
        btn.innerHTML = "<span>" + track.height + "p</span><span class='text-[10px] text-slate-400 font-mono'>" + Math.round(track.bandwidth / 1000) + " kbps</span>";
        btn.onclick = function() {
          player.configure({ abr: { enabled: false } });
          player.selectVariantTrack(track, true);
          currentQualityLabel.textContent = track.height + "p";
          qualityMenu.classList.add('hidden');
        };
        qualityList.appendChild(btn);
      });
    }

    toggleQualityBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      qualityMenu.classList.toggle('hidden');
    });

    /**
     * تحديث أوضاع العرض والتدوير:
     * إذا كان الجهاز في الوضع الرأسي (عمودي)، يتم تطبيق التدوير 90 درجة برمجياً لملء الشاشة بالعرض
     * دون أي حاجة لفتح رسائل المتصفح أو الاعتماد فقط على قفل النظام.
     */
    function updateFullscreenDisplay() {
      if (!isCleanFullscreen) {
        container.classList.remove('clean-fullscreen-mode');
        container.classList.remove('forced-landscape-mode');
        enterFsIcon.classList.remove('hidden');
        exitFsIcon.classList.add('hidden');
        return;
      }

      enterFsIcon.classList.add('hidden');
      exitFsIcon.classList.remove('hidden');

      var isPortrait = window.innerHeight > window.innerWidth;

      if (isPortrait || isForcedRotation) {
        container.classList.remove('clean-fullscreen-mode');
        container.classList.add('forced-landscape-mode');
      } else {
        container.classList.remove('forced-landscape-mode');
        container.classList.add('clean-fullscreen-mode');
      }
    }

    async function toggleCleanFullscreen() {
      isCleanFullscreen = !isCleanFullscreen;

      if (isCleanFullscreen) {
        // محاولة قفل الاتجاه أفقياً عبر نظام المتصفح إذا توفر الدعم
        if (screen.orientation && screen.orientation.lock) {
          try {
            await screen.orientation.lock('landscape');
          } catch (err) {
            // في حال عدم توفر دعم النظام يتم التدوير فوراً عبر CSS المحسوب بدقة
          }
        }

        updateFullscreenDisplay();
        showToast('ملء الشاشة بالعرض 🔄');
        window.history.pushState({ fullscreen: true }, '');
      } else {
        isForcedRotation = false;
        updateFullscreenDisplay();

        if (screen.orientation && screen.orientation.unlock) {
          try {
            screen.orientation.unlock();
          } catch (err) {}
        }
      }
    }

    // زر التدوير المخصص لقلب الاتجاه يدوياً في أي لحظة
    function toggleManualRotation() {
      if (!isCleanFullscreen) {
        // إذا لم يكن في ملء الشاشة، يدخل ملء الشاشة مع التدوير
        isCleanFullscreen = true;
        isForcedRotation = true;
      } else {
        isForcedRotation = !isForcedRotation;
      }
      updateFullscreenDisplay();
      showToast(isForcedRotation ? 'تم تدوير الشاشة 🔄' : 'الوضع الأصلي');
    }

    fullscreenBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleCleanFullscreen();
    });

    // التكيف التلقائي عند قيام المستخدم بتدوير هاتفه يدوياً
    window.addEventListener('resize', function() {
      if (isCleanFullscreen) {
        updateFullscreenDisplay();
      }
    });

    window.addEventListener('orientationchange', function() {
      setTimeout(function() {
        if (isCleanFullscreen) {
          updateFullscreenDisplay();
        }
      }, 200);
    });

    // الخروج من ملء الشاشة النظيف عند الضغط على زر الرجوع في الهاتف
    window.addEventListener('popstate', function() {
      if (isCleanFullscreen) {
        isCleanFullscreen = false;
        isForcedRotation = false;
        updateFullscreenDisplay();
        if (screen.orientation && screen.orientation.unlock) {
          try {
            screen.orientation.unlock();
          } catch (e) {}
        }
      }
    });

    // اختصارات لوحة المفاتيح
    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && isCleanFullscreen) {
        toggleCleanFullscreen();
      } else if (e.key === 'f' || e.key === 'F' || e.key === 'ب') {
        toggleCleanFullscreen();
      } else if (e.key === 'r' || e.key === 'R' || e.key === 'ق') {
        toggleManualRotation();
      } else if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.key === 'm' || e.key === 'M' || e.key === 'ة') {
        video.muted = !video.muted;
      }
    });

    // إظهار وإخفاء أزرار التحكم تلقائياً
    function showControls() {
      floatingQualityContainer.style.opacity = '1';
      floatingQualityContainer.style.pointerEvents = 'auto';
      clearTimeout(controlsTimeout);
      controlsTimeout = setTimeout(function() {
        if (!video.paused && qualityMenu.classList.contains('hidden')) {
          floatingQualityContainer.style.opacity = '0';
          floatingQualityContainer.style.pointerEvents = 'none';
        }
      }, 3500);
    }

    showControls();

    window.addEventListener('mousemove', showControls);
    window.addEventListener('touchstart', showControls, { passive: true });
    window.addEventListener('click', showControls);

    document.addEventListener('click', function(e) {
      if (!qualityMenu.contains(e.target) && e.target !== toggleQualityBtn) {
        qualityMenu.classList.add('hidden');
      }
    });

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
