<style>
:root{
  --bg:#050907;
  --bg2:#0a120e;
  --card:#101914;
  --card2:#142019;
  --green:#19d47b;
  --green2:#0e9f59;
  --text:#f4fff9;
  --muted:#8da297;
  --danger:#ff4d67;
  --border:rgba(255,255,255,.08);
  --shadow:0 15px 45px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:
    radial-gradient(circle at 10% 0%,rgba(25,212,123,.10),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(0,180,255,.07),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(18px);
  background:rgba(5,9,7,.88);
  border-bottom:1px solid var(--border);
}

.header-inner{
  max-width:1500px;
  margin:auto;
  min-height:74px;
  padding:12px 18px;
  display:flex;
  align-items:center;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  white-space:nowrap;
}

.logo-icon{
  width:44px;
  height:44px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--green),#087b46);
  box-shadow:0 0 30px rgba(25,212,123,.22);
  font-size:21px;
}

.logo strong{
  font-size:20px;
  letter-spacing:.4px;
}

.logo span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  background:#0d1511;
  border:1px solid var(--border);
  color:white;
  outline:none;
  border-radius:14px;
  padding:13px 16px 13px 43px;
  transition:.2s;
}

.search input:focus{
  border-color:rgba(25,212,123,.5);
  box-shadow:0 0 0 3px rgba(25,212,123,.08);
}

.search-icon{
  position:absolute;
  left:15px;
  top:12px;
  color:var(--muted);
}

.header-btn{
  border:1px solid var(--border);
  background:#101914;
  color:white;
  padding:12px 15px;
  border-radius:12px;
  transition:.2s;
}

.header-btn:hover{
  border-color:var(--green);
  color:var(--green);
}

.main{
  max-width:1500px;
  margin:auto;
  padding:22px 18px 50px;
}

.player-section{
  display:grid;
  grid-template-columns:minmax(0,2.2fr) minmax(280px,.8fr);
  gap:18px;
  margin-bottom:22px;
}

.player-box{
  position:relative;
  overflow:hidden;
  background:#000;
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  aspect-ratio:16/9;
}

video{
  width:100%;
  height:100%;
  display:block;
  background:#000;
  object-fit:contain;
}

.player-overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  padding:18px;
  background:linear-gradient(transparent 65%,rgba(0,0,0,.7));
}

.live-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:rgba(255,0,40,.85);
  border-radius:999px;
  padding:6px 10px;
  font-size:11px;
  font-weight:bold;
}

.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 8px white;
}

.player-info{
  background:linear-gradient(180deg,#0c1510,#09100d);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--shadow);
  min-height:100%;
}

.player-info h1{
  font-size:24px;
  margin-bottom:8px;
}

.player-info .meta{
  color:var(--muted);
  margin-bottom:20px;
}

.status{
  padding:13px;
  background:#0c1510;
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:15px;
  font-size:13px;
}

.status.ok{
  color:#67f5ae;
}

.status.error{
  color:#ff7184;
}

.control-row{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.control-btn{
  border:1px solid var(--border);
  background:#131e17;
  color:white;
  padding:10px 13px;
  border-radius:10px;
}

.control-btn:hover{
  border-color:var(--green);
  color:var(--green);
}

.categories{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:2px 0 17px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:#0d1511;
  color:#aebeb5;
  border-radius:999px;
  padding:9px 15px;
}

.cat.active,
.cat:hover{
  background:var(--green);
  color:#03150c;
  border-color:var(--green);
  font-weight:bold;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
  gap:15px;
}

.toolbar h2{
  font-size:20px;
}

.counter{
  color:var(--muted);
  font-size:13px;
}

.channels{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:13px;
}

.channel{
  position:relative;
  overflow:hidden;
  min-height:105px;
  padding:16px;
  border-radius:16px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),
    var(--card);
  border:1px solid var(--border);
  cursor:pointer;
  transition:.2s ease;
}

.channel:hover{
  transform:translateY(-3px);
  border-color:rgba(25,212,123,.45);
  box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.channel.selected{
  border-color:var(--green);
  box-shadow:0 0 0 1px rgba(25,212,123,.18);
}

.channel-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.channel-logo{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:linear-gradient(135deg,#163426,#0d2017);
  color:var(--green);
  font-weight:bold;
  font-size:15px;
}

.favorite{
  width:31px;
  height:31px;
  border:1px solid var(--border);
  background:#0b120e;
  color:#819187;
  border-radius:9px;
}

.favorite.active{
  color:#ffd34d;
}

.channel-name{
  font-size:14px;
  font-weight:bold;
  line-height:1.35;
  padding-right:5px;
}

.channel-group{
  color:var(--muted);
  font-size:10px;
  margin-top:6px;
}

.type-badge{
  position:absolute;
  top:10px;
  right:45px;
  font-size:8px;
  color:#6eeaa7;
  opacity:.75;
}

.empty{
  display:none;
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}

.footer{
  text-align:center;
  color:#66766d;
  font-size:12px;
  padding:35px 10px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  background:#122018;
  border:1px solid rgba(25,212,123,.3);
  color:#dffff0;
  padding:12px 17px;
  border-radius:12px;
  z-index:999;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:1150px){
  .channels{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

@media(max-width:900px){
  .player-section{
    grid-template-columns:1fr;
  }

  .channels{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:650px){
  .header-inner{
    flex-wrap:wrap;
  }

  .logo{
    width:100%;
  }

  .search{
    width:100%;
    order:3;
  }

  .header-btn{
    padding:10px 12px;
  }

  .channels{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }

  .channel{
    min-height:112px;
    padding:13px;
  }

  .player-info h1{
    font-size:20px;
  }
}

@media(max-width:400px){
  .channels{
    grid-template-columns:1fr 1fr;
  }

  .channel-name{
    font-size:12px;
  }
}
</style>
</head>

    <p>Try another search or category.</p>

</main>

<footer class="footer">
  © 2026 KURDISTAN IPTV — Live TV Platform

/* =========================================================
   PARSER
   ========================================================= */

function parsePlaylist(text){

  const lines = text
    .split(/\r?\n/)
    .map(x => x.trim())
    .filter(Boolean);

  const result = [];

  for(let i = 0; i < lines.length - 1; i++){

    const nameLine = lines[i];
    const urlLine = lines[i + 1];

    if(
      /^(KU|AR)\s*\|/i.test(nameLine) &&
      /^https?:\/\//i.test(urlLine)
    ){

      const parts = nameLine.split("|");
      const group = parts[0].trim();
      const name = parts.slice(1).join("|").trim();

      result.push({
        id: cryptoRandom(),
        group,
        name,
        url:urlLine,
        type:getStreamType(urlLine)
      });

      i++;
    }
  }

  return result;
}

function cryptoRandom(){
  return Math.random().toString(36).substring(2,10);
}

function getStreamType(url){

  const clean = url.toLowerCase();

  if(clean.includes("extension=ts") || /\.ts(\?|$)/i.test(clean)){
    return "TS";
  }

  if(clean.includes(".m3u8")){
    return "HLS";
  }

  return "STREAM";
}

/* =========================================================

let currentChannel = null;

/* =========================================================

const video = document.getElementById("video");

/* =========================================================
   CATEGORY DETECTION
   ========================================================= */

function getCategory(channel){

  const n = channel.name.toUpperCase();

  if(
    n.includes("SPORT") ||
    n.includes("BEIN SPORT") ||
    n.includes("ALKASS") ||
    n.includes("IRAQIA SPORT")
  ) return "SPORT";

  if(
    n.includes("KIDS") ||
    n.includes("KID") ||
    n.includes("ZAROK") ||
    n.includes("BABY SHARK") ||
    n.includes("TOM AND JERRY") ||
    n.includes("ZOOMOO") ||
    n.includes("RYAN")
  ) return "KIDS";

  if(
    n.includes("QURAN") ||
    n.includes("SUNNAH") ||
    n.includes("ISLAMIC") ||
    n.includes("RASULULLAH") ||
    n.includes("MIHRAB")
  ) return "QURAN";

  if(
    n.includes("MOVIE") ||
    n.includes("ACTION") ||
    n.includes("NETFLIX") ||
    n.includes("BOLLYWOOD") ||
    n.includes("DRAMA")
  ) return "MOVIES";

  if(
    n.includes("NEWS") ||
    n.includes("RUDAW") ||
    n.includes("CNN") ||
    n.includes("JAZEERA") ||
    n.includes("AL JAZEERA") ||
    n.includes("AL ARABIA") ||
    n.includes("HABER")
  ) return "NEWS";

  if(
    n.includes("MUSIC") ||
    n.includes("FM")
  ) return "MUSIC";

  if(
    n.includes("FAMILY")
  ) return "FAMILY";

  return channel.group;
}


/* =========================================================
   CATEGORIES
   ========================================================= */

function buildCategories(){

  const base = [
    "ALL",
    "KU",
    "AR",
    "SPORT",
    "NEWS",
    "MOVIES",
    "KIDS",
    "QURAN",
    "MUSIC",
    "FAMILY"
  ];

  categoriesContainer.innerHTML = "";

  base.forEach(cat => {

    const button = document.createElement("button");

    button.className = "cat" +
      (currentCategory === cat ? " active" : "");

    button.textContent = cat;

    button.onclick = () => {

      currentCategory = cat;
      favoritesOnly = false;

      document.getElementById("favBtn").classList.remove("active");

      buildCategories();
      renderChannels();
    };

    categoriesContainer.appendChild(button);

  });
}


/* =========================================================
   FILTER
   ========================================================= */

function filteredChannels(){

  const query = searchInput.value
    .trim()
    .toLowerCase();

  return channels.filter(channel => {

    const matchesSearch =
      !query ||
      channel.name.toLowerCase().includes(query) ||
      channel.group.toLowerCase().includes(query);

    const category =
      currentCategory === "ALL" ||
      getCategory(channel) === currentCategory;

    const favorite =
      !favoritesOnly ||
      favorites.has(channel.id);

    return matchesSearch && category && favorite;
  });
}


/* =========================================================
   RENDER CHANNELS
   ========================================================= */

function renderChannels(){

  const list = filteredChannels();

  channelContainer.innerHTML = "";

  counter.textContent =
    `${list.length} / ${channels.length} channels`;

  empty.style.display =
    list.length ? "none" : "block";

  list.forEach(channel => {

    const card = document.createElement("article");

    card.className =
      "channel" +
      (currentChannel?.id === channel.id ? " selected" : "");

    const favorite =
      favorites.has(channel.id);

    const initials =
      channel.name
        .replace(/TV|HD|\+/gi,"")
        .trim()
        .split(/\s+/)
        .slice(0,2)
        .map(x => x[0])
        .join("")
        .toUpperCase();

    card.innerHTML = `
      <div class="type-badge">${channel.type}</div>

      <div class="channel-top">

        <div class="channel-logo">
          ${escapeHTML(initials || "TV")}
        </div>

        <button
          class="favorite ${favorite ? "active" : ""}"
          title="Favorite"
          aria-label="Favorite"
        >
          ${favorite ? "★" : "☆"}
        </button>

      </div>

      <div class="channel-name">
        ${escapeHTML(channel.name)}
      </div>

      <div class="channel-group">
        ${escapeHTML(getCategory(channel))}
      </div>
    `;

    const favButton =
      card.querySelector(".favorite");

    favButton.addEventListener("click", event => {

      event.stopPropagation();

      toggleFavorite(channel);

    });

    card.addEventListener("click", () => {
      playChannel(channel);
    });

    channelContainer.appendChild(card);
  });
}


/* =========================================================
   PLAY CHANNEL
   ========================================================= */

function playChannel(channel){

  currentChannel = channel;
  currentIndex = channels.indexOf(channel);

  currentName.textContent = channel.name;

  currentMeta.textContent =
    `${getCategory(channel)} • ${channel.type}`;

  setStatus(
    `Connecting to ${channel.name}...`,
    "ok"
  );

  destroyPlayer();

  video.removeAttribute("src");
  video.load();

  const url = channel.url;

  if(channel.type === "HLS"){

    if(window.Hls && Hls.isSupported()){

      hls = new Hls({
        enableWorker:true,
        lowLatencyMode:false,
        backBufferLength:30,
        maxBufferLength:30,
        capLevelToPlayerSize:true,
        startFragPrefetch:true
      });

      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {

        setStatus(
          "Live stream connected",
          "ok"
        );

        video.play().catch(() => {});

      });

      hls.on(Hls.Events.ERROR, (event,data) => {

        if(data.fatal){

          setStatus(
            "Stream error — press Retry",
            "error"
          );

        }

      });

    }else if(
      video.canPlayType("application/vnd.apple.mpegurl")
    ){

      video.src = url;

      video.addEventListener(
        "loadedmetadata",
        () => {
          video.play().catch(() => {});
        },
        {once:true}
      );

      setStatus(
        "Native HLS playback",
        "ok"
      );

    }else{

      setStatus(
        "This browser does not support HLS",
        "error"
      );

    }

  }else{

    video.src = url;

    video.addEventListener(
      "loadedmetadata",
      () => {
        video.play().catch(() => {});
      },
      {once:true}
    );

    video.addEventListener(
      "error",
      () => {

        setStatus(
          "Direct TS playback is not supported by this browser or the source is unavailable.",
          "error"
        );

      },
      {once:true}
    );

    setStatus(
      "Trying direct TS stream...",
      "ok"
    );
  }

  renderChannels();
}


/* =========================================================
   PLAYER EVENTS
   ========================================================= */

video.addEventListener("playing", () => {

  if(currentChannel){
    setStatus(
      `LIVE • ${currentChannel.name}`,
      "ok"
    );
  }

});

video.addEventListener("waiting", () => {

  if(currentChannel){
    setStatus(
      "Buffering...",
      "ok"
    );
  }

});

video.addEventListener("stalled", () => {

  if(currentChannel){
    setStatus(
      "Stream stalled — waiting for data...",
      "error"
    );
  }

});


/* =========================================================
   RETRY
   ========================================================= */

function retryStream(){

  if(currentChannel){
    playChannel(currentChannel);
  }else{
    showToast("Select a channel first");
  }

}


/* =========================================================
   STOP
   ========================================================= */

function stopStream(){

  destroyPlayer();

  video.pause();
  video.removeAttribute("src");
  video.load();

  setStatus(
    "Playback stopped",
    ""
  );

}


/* =========================================================
   DESTROY PLAYER
   ========================================================= */

function destroyPlayer(){

  if(hls){

    try{
      hls.destroy();
    }catch(e){}

    hls = null;
  }
}


/* =========================================================
   FULLSCREEN
   ========================================================= */

function fullscreenVideo(){

  if(video.requestFullscreen){
    video.requestFullscreen();
  }else if(video.webkitEnterFullscreen){
    video.webkitEnterFullscreen();
  }else{
    showToast("Fullscreen is not supported");
  }

}


/* =========================================================
   FAVORITES
   ========================================================= */

function toggleFavorite(channel){

  if(favorites.has(channel.id)){

    favorites.delete(channel.id);
    showToast("Removed from favorites");

  }else{

    favorites.add(channel.id);
    showToast("Added to favorites");

  }

  localStorage.setItem(
    "kurdistan_iptv_favorites",
    JSON.stringify([...favorites])
  );

  renderChannels();
}


document.getElementById("favBtn")
.addEventListener("click", () => {

  favoritesOnly = !favoritesOnly;

  currentCategory = "ALL";

  document
    .getElementById("favBtn")
    .classList.toggle("active", favoritesOnly);

  buildCategories();
  renderChannels();

});


/* =========================================================
   SEARCH
   ========================================================= */

searchInput.addEventListener(
  "input",
  renderChannels
);


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message,type){

  statusBox.textContent = message;

  statusBox.className =
    "status" +
    (type ? ` ${type}` : "");

}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function showToast(message){

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  },2200);

}


/* =========================================================
   SECURITY / HTML ESCAPE
   ========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */

document.addEventListener("keydown", event => {

  if(event.key === "Escape"){
    searchInput.blur();
  }

  if(event.key === "/"){

    if(document.activeElement !== searchInput){

      event.preventDefault();
      searchInput.focus();

    }

  }

});


/* =========================================================
   INITIALIZE
   ========================================================= */

buildCategories();
renderChannels();
